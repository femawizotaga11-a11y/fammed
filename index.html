<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ระบบบริการปฐมภูมิและเครือข่ายแพทย์เวชศาสตร์ครอบครัว (Family Medicine - Fam Med) ในจังหวัดนราธิวาส</title>
  <style>
    /* Motion: CSS keyframes scroll the system name continuously without external libraries. */
    :root {
      color-scheme: light;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      height: 100dvh;
    }

    .app-frame {
      display: block;
      width: 100%;
      height: 100dvh;
      border: 0;
    }

    .loading-screen {
      position: fixed;
      z-index: 1;
      inset: 0;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: #ffffff;
      color: #1f3a5f;
      opacity: 1;
      transition: opacity 240ms ease-out, visibility 0s linear 240ms;
    }

    .loading-screen[hidden] {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .loading-content {
      width: min(100%, 50rem);
      overflow: hidden;
    }

    .marquee {
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: system-marquee 22s linear infinite;
      will-change: transform;
    }

    .marquee-text {
      flex: 0 0 auto;
      margin: 0;
      padding-right: 3rem;
      color: #1f3a5f;
      font: 600 clamp(1rem, 2.8vw, 1.55rem)/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      white-space: nowrap;
    }

    @keyframes system-marquee {
      to {
        transform: translateX(-50%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-screen {
        transition: none;
      }

      .marquee {
        overflow: visible;
        mask-image: none;
      }

      .marquee-track {
        width: 100%;
        animation: none;
      }

      .marquee-text {
        max-width: calc(100vw - 2rem);
        padding: 0;
        text-align: center;
        white-space: normal;
      }

      .marquee-text[aria-hidden="true"] {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
    <div class="loading-content">
      <div class="marquee">
        <div class="marquee-track">
          <p class="marquee-text">ระบบบริการปฐมภูมิและเครือข่ายแพทย์เวชศาสตร์ครอบครัว (Family Medicine - Fam Med) ในจังหวัดนราธิวาส</p>
          <p class="marquee-text" aria-hidden="true">ระบบบริการปฐมภูมิและเครือข่ายแพทย์เวชศาสตร์ครอบครัว (Family Medicine - Fam Med) ในจังหวัดนราธิวาส</p>
        </div>
      </div>
    </div>
  </div>

  <iframe
    id="app-frame"
    class="app-frame"
    src="https://script.google.com/macros/s/AKfycbyR5XdjW5wpzrVBL-YZ0kCTz5FLwsuKbQvpaNKmUoqH9xgY5o2rTHwqIwZBRg_K4FFjSA/exec"
    title="ระบบบริการปฐมภูมิและเครือข่ายแพทย์เวชศาสตร์ครอบครัว (Family Medicine - Fam Med) ในจังหวัดนราธิวาส"
    allow="fullscreen"
    allowfullscreen
  ></iframe>

  <script>
    const appFrame = document.getElementById('app-frame');
    const loadingScreen = document.getElementById('loading-screen');

    appFrame.addEventListener('load', () => {
      loadingScreen.hidden = true;
    }, { once: true });
  </script>
</body>
</html>
